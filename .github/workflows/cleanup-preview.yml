name: Cleanup Preview on Branch Delete

on:
  delete:
    branches-ignore: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event.ref_type == 'branch' }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Remove preview directory
        run: |
          SAFE_BRANCH=$(echo "${{ github.event.ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          PREVIEW_DIR="preview/${SAFE_BRANCH}"

          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "cleanup: remove preview for deleted branch ${SAFE_BRANCH}"
            git push
            echo "Removed $PREVIEW_DIR"
          else
            echo "No preview directory found for $PREVIEW_DIR, nothing to do."
          fi
