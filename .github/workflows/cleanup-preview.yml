name: Cleanup Preview on Branch Delete

# ── Configuration ─────────────────────────────────────────────────────────────
# Must match the TARGET_REPO value in deploy.yml
# Requires the same DEPLOY_PAT secret
# ──────────────────────────────────────────────────────────────────────────────
env:
  TARGET_REPO: coveo-chevrolet-ca/order-guide

on:
  delete:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ github.event.ref_type == 'branch' }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: gh-pages
          fetch-depth: 1
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Remove preview directory
        run: |
          SAFE_BRANCH=$(echo "${{ github.event.ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          PREVIEW_DIR="preview/${SAFE_BRANCH}"

          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "cleanup: remove preview for deleted branch ${SAFE_BRANCH}"
            git push "https://x-access-token:${{ secrets.DEPLOY_PAT }}@github.com/${{ env.TARGET_REPO }}.git" gh-pages
            echo "Removed $PREVIEW_DIR"
          else
            echo "No preview directory found for $PREVIEW_DIR, nothing to do."
          fi
